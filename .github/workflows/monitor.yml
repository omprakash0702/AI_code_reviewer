name: Uptime Monitor

on:
  schedule:
    # Every 15 minutes around the clock
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    name: API health check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping health endpoint
        id: ping
        run: |
          if [ -z "${{ secrets.API_URL }}" ]; then
            echo "::warning::API_URL secret not set — skipping health check"
            echo "healthy=skip" >> $GITHUB_OUTPUT
            exit 0
          fi

          STATUS=$(curl -sf "${{ secrets.API_URL }}/" \
            -o response.json \
            -w "%{http_code}" \
            --max-time 15 || echo "000")

          echo "status=$STATUS" >> $GITHUB_OUTPUT

          if [ "$STATUS" = "200" ]; then
            echo "✅ API is healthy (HTTP 200)"
            echo "healthy=true" >> $GITHUB_OUTPUT
          else
            echo "❌ API returned HTTP $STATUS"
            echo "healthy=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify response shape
        if: steps.ping.outputs.healthy == 'true'
        run: |
          python3 - <<'PYEOF'
          import json, sys
          try:
              with open("response.json") as f:
                  data = json.load(f)
              assert data.get("status") == "ok", f"Unexpected response: {data}"
              print(f"✅ Response shape valid: {data}")
          except Exception as e:
              print(f"::warning::Health check response unexpected: {e}")
          PYEOF

      - name: Check for existing outage issue
        id: find-issue
        if: steps.ping.outputs.healthy == 'false'
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              labels: 'api-outage',
              state: 'open',
              per_page: 1,
            });
            return issues.data.length > 0 ? String(issues.data[0].number) : '';

      - name: Open outage issue (if none open)
        if: steps.ping.outputs.healthy == 'false' && steps.find-issue.outputs.result == ''
        uses: actions/github-script@v7
        with:
          script: |
            const run_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ts      = new Date().toISOString();
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🚨 API Outage detected — ${ts.slice(0, 16)}Z`,
              body: [
                `The PR Guardian AI health check failed.`,
                ``,
                `| Field | Value |`,
                `|---|---|`,
                `| **Time (UTC)** | ${ts} |`,
                `| **URL** | \`${{ secrets.API_URL }}/\` |`,
                `| **HTTP Status** | ${{ steps.ping.outputs.status }} |`,
                `| **Run** | [View logs](${run_url}) |`,
                ``,
                `This issue will be closed automatically when the service recovers.`,
              ].join('\n'),
              labels: ['api-outage', 'bug'],
            });
            console.log('Outage issue created');

      - name: Close outage issue on recovery
        if: steps.ping.outputs.healthy == 'true' && steps.find-issue.outputs.result != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = parseInt('${{ steps.find-issue.outputs.result }}', 10);
            const run_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number,
              body: `✅ Service recovered at ${new Date().toISOString()}. [Health check run](${run_url})`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number,
              state: 'closed',
            });
            console.log(`Closed outage issue #${issue_number}`);
