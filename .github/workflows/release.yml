name: Release

on:
  push:
    tags:
      - "v*"   # trigger on v1.0.0, v1.2.3-beta, etc.

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for changelog generation

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── Build frontend ──────────────────────────────────────
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
        env:
          NODE_ENV: production

      - name: Package frontend dist
        run: |
          cd frontend
          zip -r ../pr-guardian-frontend-${{ github.ref_name }}.zip dist/
          echo "Frontend packaged: pr-guardian-frontend-${{ github.ref_name }}.zip"

      # ── Generate changelog from commit history ───────────────
      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "${{ github.ref_name }}" | head -1 || echo "")

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${{ github.ref_name }}"
            echo "Generating changelog: $RANGE"
          else
            RANGE="HEAD"
            echo "First release — showing all commits"
          fi

          python3 - "$RANGE" > changelog.md <<'PYEOF'
          import subprocess, sys, re

          range_arg = sys.argv[1]
          log = subprocess.check_output(
              ["git", "log", range_arg, "--pretty=format:%H|%s|%an", "--no-merges"],
              text=True
          ).strip()

          EMOJIS = {
              "feat":     "✨",
              "fix":      "🐛",
              "security": "🔒",
              "perf":     "⚡",
              "refactor": "♻️",
              "docs":     "📝",
              "test":     "🧪",
              "ci":       "⚙️",
              "chore":    "🔧",
              "build":    "📦",
          }
          label_map = {
              "feat": "New Features", "fix": "Bug Fixes",
              "security": "Security", "perf": "Performance",
              "refactor": "Refactoring", "docs": "Documentation",
              "test": "Tests", "ci": "CI/CD", "chore": "Chores", "build": "Build",
          }

          sections = {k: [] for k in EMOJIS}
          other = []

          for line in log.splitlines():
              if not line.strip():
                  continue
              parts = line.split("|", 2)
              if len(parts) < 2:
                  continue
              sha, subject, author = parts[0][:7], parts[1], (parts[2] if len(parts) > 2 else "")
              matched = False
              for prefix, emoji in EMOJIS.items():
                  pattern = rf"^{prefix}[\(\!:]"
                  if re.match(pattern, subject, re.IGNORECASE):
                      sections[prefix].append(f"- {emoji} {subject} (`{sha}`)")
                      matched = True
                      break
              if not matched:
                  other.append(f"- {subject} (`{sha}`)")

          lines = [f"## What's Changed\n"]
          for key, items in sections.items():
              if items:
                  lines.append(f"\n### {EMOJIS[key]} {label_map[key]}\n")
                  lines.extend(items)
          if other:
              lines.append(f"\n### 🔀 Other Changes\n")
              lines.extend(other)

          if not any(sections.values()) and not other:
              lines.append("_No changes recorded._")

          print("\n".join(lines))
          PYEOF

      # ── Create GitHub Release ────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PR Guardian AI ${{ github.ref_name }}"
          body_path: changelog.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # v1.0.0-beta → prerelease
          files: |
            pr-guardian-frontend-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
