name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel any in-flight run for the same branch/PR on new push
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend — lint, security scan, unit tests, coverage
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Lint — flake8
        run: |
          flake8 server --max-line-length=120 --statistics --exit-zero \
            --format='::warning file=%(path)s,line=%(row)d,col=%(col)d::%(path)s:%(row)d:%(col)d %(code)s %(text)s'

      - name: Security scan — bandit
        run: |
          bandit -r server -ll -f json -o bandit-report.json || true
          python3 -c "
          import json, sys
          with open('bandit-report.json') as f:
              data = json.load(f)
          issues = data.get('results', [])
          high = [i for i in issues if i['issue_severity'] == 'HIGH']
          if high:
              for i in high:
                  print(f\"::warning file={i['filename']},line={i['line_number']}::{i['issue_text']}\")
          print(f'Bandit: {len(issues)} findings ({len(high)} high severity)')
          "

      - name: Unit tests with coverage
        run: |
          pytest tests/unit -q \
            --cov=server \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short
        env:
          AI_API_KEY: dummy-key-for-unit-tests
          AI_MODEL: gpt-4o-mini

      - name: Integration tests
        run: pytest tests/integration -q --tb=short
        env:
          AI_API_KEY: dummy-key-for-unit-tests
          AI_MODEL: gpt-4o-mini

      - name: Annotate coverage summary
        if: matrix.python-version == '3.11'
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          pct = float(root.attrib.get('line-rate', 0)) * 100
          print(f'Coverage: {pct:.1f}%')
          if pct < 40:
              print('::warning::Test coverage is below 40%')
          "

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # Frontend — install, type-check, build
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build (production)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check bundle size
        run: |
          du -sh dist/
          # Warn if total build exceeds 5MB
          SIZE=$(du -sb dist/ | awk '{print $1}')
          if [ "$SIZE" -gt 5242880 ]; then
            echo "::warning::Frontend bundle exceeds 5 MB (${SIZE} bytes)"
          fi

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Gate — require both jobs to pass before merge
  # ─────────────────────────────────────────────────────────────
  all-checks-pass:
    name: All checks passed
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [[ "${{ needs.backend.result }}" != "success" || "${{ needs.frontend.result }}" != "success" ]]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All checks passed."
