name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One review per PR — cancel and restart on new push
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1 — Review every changed source file, post PR comment
  # ──────────────────────────────────────────────────────────────
  review:
    name: AI review changed files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          pip install flake8 bandit httpx
          sudo apt-get install -y jq

      - name: Get changed source files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view ${{ github.event.pull_request.number }} \
            --json files \
            --jq '.files[].path' \
            | grep -E '\.(py|js|ts|jsx|tsx)$' > changed_files.txt || true

          COUNT=$(wc -l < changed_files.txt | tr -d ' ')
          echo "Source files changed: $COUNT"
          cat changed_files.txt

      - name: Analyse and review each file
        id: review
        timeout-minutes: 15
        env:
          REVIEW_API_URL: ${{ secrets.REVIEW_API_URL }}
        run: |
          echo "[]"  > all_results.json
          >            all_patches.diff
          SKIPPED=0
          REVIEWED=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ ! -f "$file" ]; then
              echo "  ⏭  $file — not found, skipping"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            echo "──── $file"

            # ── Static analysis ────────────────────────────────
            python3 - "$file" <<'PYEOF'
import json, subprocess, sys
file = sys.argv[1]
def run(cmd):
    r = subprocess.run(cmd, capture_output=True, text=True)
    return r.stdout.strip().splitlines()
result = {
    "lint_issues":       run(["flake8", file, "--max-line-length=120"]),
    "security_issues":   run(["bandit", "-q", "-ll", file]),
    "format_suggestions": [],
}
with open("analysis.json", "w") as f:
    json.dump(result, f)
PYEOF

            # ── Build JSON payload (safe encoding) ─────────────
            python3 - "$file" <<'PYEOF'
import json, sys
file = sys.argv[1]
try:
    with open(file, encoding="utf-8", errors="replace") as f:
        code = f.read(50_000)     # cap at 50 KB per file
    with open("analysis.json") as f:
        analysis = json.load(f)
except Exception as e:
    print(f"  Warning: could not read {file}: {e}")
    code, analysis = "", {}
with open("request.json", "w") as f:
    json.dump({"filename": file, "code": code, "analysis": analysis}, f)
PYEOF

            # ── Call PR Guardian API (3 retries) ───────────────
            SUCCESS=false
            for attempt in 1 2 3; do
              if [ -z "$REVIEW_API_URL" ]; then
                echo '{"issues":[],"patch":"","error":"REVIEW_API_URL secret not set"}' > result.json
                break
              fi
              HTTP=$(curl -sf -X POST \
                -H "Content-Type: application/json" \
                -d @request.json \
                "${REVIEW_API_URL}/review" \
                -o result.json \
                -w "%{http_code}" \
                --max-time 45 || echo "000")
              if [ "$HTTP" = "200" ]; then
                SUCCESS=true; break
              fi
              echo "  API attempt $attempt failed (HTTP $HTTP), retrying..."
              sleep $((attempt * 5))
            done
            if [ "$SUCCESS" != "true" ] && [ -n "$REVIEW_API_URL" ]; then
              echo '{"issues":[],"patch":"","error":"API unreachable after 3 attempts"}' > result.json
            fi

            # ── Collect patch ──────────────────────────────────
            python3 -c "
import json
with open('result.json') as f:
    r = json.load(f)
p = r.get('patch', '').strip()
if p:
    open('all_patches.diff', 'a').write(p + '\n')
"

            # ── Accumulate result ──────────────────────────────
            python3 - "$file" <<'PYEOF'
import json, sys
file = sys.argv[1]
with open("result.json") as f:
    result = json.load(f)
result["filename"] = file
with open("all_results.json") as f:
    all_results = json.load(f)
all_results.append(result)
with open("all_results.json", "w") as f:
    json.dump(all_results, f, indent=2)
PYEOF

            REVIEWED=$((REVIEWED + 1))

          done < changed_files.txt

          echo "reviewed=$REVIEWED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED"   >> $GITHUB_OUTPUT

      - name: Upload patches artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-patches-${{ github.run_id }}
          path: all_patches.diff
          if-no-files-found: ignore
          retention-days: 7

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let results = [];
            try { results = JSON.parse(fs.readFileSync('all_results.json', 'utf8')); } catch {}

            const totalIssues   = results.reduce((s, r) => s + (r.issues?.length ?? 0), 0);
            const criticalCount = results.reduce((s, r) =>
              s + (r.issues?.filter(i => i.severity === 'critical').length ?? 0), 0);
            const highCount     = results.reduce((s, r) =>
              s + (r.issues?.filter(i => i.severity === 'high').length ?? 0), 0);
            const hasPatches    = results.some(r => r.patch?.trim());
            const filesReviewed = ${{ steps.review.outputs.reviewed || 0 }};
            const filesSkipped  = ${{ steps.review.outputs.skipped  || 0 }};

            const SEV_EMOJI = { critical: '🔴', high: '🟠', medium: '🟡', low: '🟢' };
            const blockStatus = criticalCount > 0 ? '🚫 Block merge' :
                                highCount > 0     ? '⚠️  Review required' :
                                totalIssues > 0   ? '💬 Minor suggestions' : '✅ Approve';

            let body = `## 🛡️ PR Guardian AI Review\n\n`;
            body += `> **${blockStatus}**\n\n`;
            body += `| Metric | Value |\n|---|---|\n`;
            body += `| Files reviewed | ${filesReviewed} |\n`;
            if (filesSkipped > 0) body += `| Files skipped | ${filesSkipped} |\n`;
            body += `| Total issues | ${totalIssues} |\n`;
            body += `| Critical | ${criticalCount === 0 ? '✅ None' : criticalCount} |\n`;
            body += `| High | ${highCount === 0 ? '✅ None' : highCount} |\n`;
            body += `| Auto-fix available | ${hasPatches ? '✅ Yes — see auto_fix job' : 'No'} |\n\n`;

            if (totalIssues === 0) {
              body += `### ✅ All clear\n\nNo issues detected in changed files.\n`;
            } else {
              for (const r of results) {
                if (!r.issues?.length) continue;
                body += `\n---\n### \`${r.filename}\`\n`;
                for (const issue of r.issues.slice(0, 10)) {
                  const emoji = SEV_EMOJI[issue.severity] ?? '⚪';
                  const sev   = (issue.severity ?? 'low').toUpperCase();
                  const cat   = issue.category ? ` · *${issue.category}*` : '';
                  body += `\n**${emoji} ${sev}${cat} — ${issue.title ?? 'Issue'}**\n`;
                  if (issue.description)   body += `${issue.description}\n`;
                  if (issue.impact)        body += `\n> **Impact:** ${issue.impact}\n`;
                  if (issue.suggested_fix) {
                    body += `\n> **Fix:**\n> \`\`\`\n> ${issue.suggested_fix.replace(/\n/g, '\n> ')}\n> \`\`\`\n`;
                  }
                }
              }
            }

            body += `\n---\n_[PR Guardian AI](https://github.com/${{ github.repository }}) · run [\`${{ github.run_id }}\`](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})_`;

            // Find previous bot comment and update it (avoid comment spam)
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.data.find(c =>
              c.user?.type === 'Bot' && c.body?.startsWith('## 🛡️ PR Guardian AI Review')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                body,
              });
            }

  # ──────────────────────────────────────────────────────────────
  # JOB 2 — Apply patches, open a fix PR
  # ──────────────────────────────────────────────────────────────
  auto_fix:
    name: Apply AI patches
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.fork == false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download patches
        uses: actions/download-artifact@v4
        with:
          name: ai-patches-${{ github.run_id }}
        continue-on-error: true

      - name: Apply patches and open fix PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s all_patches.diff ]; then
            echo "No patches generated — nothing to apply."
            exit 0
          fi

          BRANCH="ai-fix/${{ github.event.pull_request.head.ref }}-${{ github.run_id }}"
          git config user.name  "PR Guardian AI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git apply --ignore-whitespace --reject all_patches.diff 2>&1 || {
            echo "::warning::Some hunks failed to apply — commit whatever did apply"
          }

          # Only create a PR if there are actual changes
          if git diff --quiet && git diff --cached --quiet; then
            echo "Patch applied no net changes — skipping fix PR."
            exit 0
          fi

          git add -A
          git commit -m "🤖 AI auto-fix: apply suggested patches [skip ci]"
          git push origin "$BRANCH"

          gh pr create \
            --title "🤖 AI Auto-Fix for #${{ github.event.pull_request.number }}" \
            --body "$(printf '## AI-Generated Patches\n\nAutomated fixes suggested by **PR Guardian AI** for PR #%s.\n\n> ⚠️ Review before merging — AI patches are suggestions, not guarantees.\n\n---\n_Triggered by run [%s](%s)_' \
              '${{ github.event.pull_request.number }}' \
              '${{ github.run_id }}' \
              'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}')" \
            --base "${{ github.event.pull_request.base.ref }}" \
            --head "$BRANCH" \
            --draft
